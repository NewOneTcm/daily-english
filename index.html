<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每天用英语 · Daily English</title>
<style>
  :root {
    --bg: #f6f7f6;
    --panel: #ffffff;
    --ink: #1d2421;
    --ink-2: #5c6660;
    --line: #e3e7e4;
    --accent: #17795b;
    --accent-soft: #e4f2ec;
    --amber: #d97b1e;
    --red: #c2483d;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    line-height: 1.6; min-height: 100vh;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 80px; }

  header.top {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0 16px; flex-wrap: wrap;
  }
  header.top h1 { font-size: 18px; font-weight: 700; letter-spacing: 0; }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 11px; font-size: 13px; color: var(--ink-2);
  }
  .pill.streak b { color: var(--amber); font-size: 14px; }
  .pill.level { cursor: pointer; font-weight: 600; color: var(--accent); }
  .pill.level:hover { border-color: var(--accent); }

  nav.tabs {
    display: flex; gap: 4px; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 4px; margin-bottom: 18px;
  }
  nav.tabs button {
    flex: 1; border: none; background: none; padding: 8px 1px;
    font-size: 13px; color: var(--ink-2); border-radius: 6px; cursor: pointer;
    font-family: inherit;
  }
  nav.tabs button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav.tabs .badge {
    display: inline-block; min-width: 17px; text-align: center;
    background: var(--red); color: #fff; border-radius: 999px;
    font-size: 11px; padding: 0 5px; margin-left: 4px; line-height: 17px;
  }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px;
  }
  .card + .card { margin-top: 14px; }

  .task-type {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); border-radius: 999px; padding: 2px 10px;
  }
  .task-cn { font-size: 19px; font-weight: 700; margin: 12px 0 6px; }
  .task-en { color: var(--ink-2); font-size: 15px; font-style: italic; }
  .task-meta { margin-top: 12px; font-size: 13px; color: var(--ink-2); }

  textarea {
    width: 100%; min-height: 140px; resize: vertical;
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; font-size: 15px; font-family: inherit;
    background: #fbfcfb; color: var(--ink); line-height: 1.6;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  input[type=text] {
    width: 100%; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 9px 12px; font-size: 14px; font-family: inherit; background: #fbfcfb;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: var(--radius); padding: 10px 18px; font-size: 14px;
    cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .btn:hover { border-color: #c8cfcb; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #12644c; }
  .btn.ghost { border-color: transparent; color: var(--ink-2); font-weight: 500; }
  .btn.ghost:hover { background: #eff1ef; }
  .btn.danger { color: var(--red); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

  .wordcount { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
  .wordcount b { color: var(--accent); }

  .timer { font-size: 40px; font-weight: 700; text-align: center; padding: 18px 0 4px; font-variant-numeric: tabular-nums; }
  .timer-label { text-align: center; color: var(--ink-2); font-size: 13px; margin-bottom: 8px; }

  .done-hero { text-align: center; padding: 26px 10px; }
  .done-hero .big { font-size: 42px; }
  .done-hero h2 { font-size: 20px; margin: 8px 0 4px; }
  .done-hero p { color: var(--ink-2); font-size: 14px; }

  .banner {
    border: 1px solid #f0d9b8; background: #fdf6ec; color: #7a5210;
    border-radius: var(--radius); padding: 12px 16px; font-size: 14px;
    margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .banner .btn { padding: 5px 12px; font-size: 13px; }

  .review-q { font-size: 20px; font-weight: 700; text-align: center; padding: 24px 8px 6px; }
  .review-ctx { text-align: center; color: var(--ink-2); font-size: 14px; padding-bottom: 10px; }
  .review-a {
    text-align: center; font-size: 18px; color: var(--accent); font-weight: 600;
    padding: 14px 8px; border-top: 1px dashed var(--line);
  }
  .grade-row { display: flex; gap: 8px; }
  .grade-row .btn { flex: 1; }

  ul.list { list-style: none; }
  ul.list li {
    display: flex; align-items: baseline; gap: 10px;
    padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  ul.list li:last-child { border-bottom: none; }
  ul.list .en { font-weight: 600; }
  ul.list .zh { color: var(--ink-2); flex: 1; }
  ul.list .due { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  ul.list .due.today { color: var(--red); font-weight: 600; }

  .hist-item { border-bottom: 1px solid var(--line); padding: 12px 2px; }
  .hist-item:last-child { border-bottom: none; }
  .hist-head { display: flex; gap: 10px; align-items: baseline; font-size: 13px; color: var(--ink-2); }
  .hist-head b { color: var(--ink); font-size: 14px; }
  .hist-text {
    margin-top: 6px; font-size: 14px; color: var(--ink);
    background: #fbfcfb; border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; white-space: pre-wrap; word-break: break-word;
  }

  .empty { text-align: center; color: var(--ink-2); padding: 30px 10px; font-size: 14px; }
  .hint { font-size: 13px; color: var(--ink-2); margin-top: 8px; }
  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

  ul.tips { list-style: none; margin-top: 10px; }
  ul.tips li {
    padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 8px; font-size: 14px; background: #fbfcfb;
  }
  ul.tips .tip-zh { font-weight: 600; }
  ul.tips .tip-en { color: var(--accent); font-weight: 600; margin-top: 2px; }
  ul.tips .tip-ctx { color: var(--ink-2); font-size: 13px; margin-top: 2px; font-style: italic; }
  ul.tips .btn { padding: 4px 12px; font-size: 12px; margin-top: 6px; }
  ul.tips .saved-mark { font-size: 12px; color: var(--accent); margin-top: 6px; display: inline-block; }
  .tag-fb {
    font-size: 11px; background: #fbe9e7; color: var(--red);
    border-radius: 4px; padding: 0 6px; margin-right: 2px; white-space: nowrap;
  }
  .ai-status { font-size: 13px; color: var(--ink-2); margin-top: 8px; }

  /* onboarding */
  .level-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  @media (max-width: 520px) { .level-grid { grid-template-columns: 1fr; } }
  .level-opt {
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); padding: 14px; cursor: pointer; text-align: left;
    font-family: inherit;
  }
  .level-opt:hover { border-color: var(--accent); }
  .level-opt b { font-size: 16px; color: var(--accent); }
  .level-opt p { font-size: 13px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; }

  .stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; text-align: center;
  }
  .stat b { display: block; font-size: 24px; color: var(--accent); }
  .stat span { font-size: 12px; color: var(--ink-2); }
  .stat.amber b { color: var(--amber); }

  /* 日历（日记） */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-grid .dow { text-align: center; font-size: 12px; color: var(--ink-2); padding: 4px 0; }
  .cal-day {
    aspect-ratio: 1; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); font-size: 13px; cursor: pointer; position: relative;
    font-family: inherit; color: var(--ink);
  }
  .cal-day:hover { border-color: var(--accent); }
  .cal-day.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cal-day.today { font-weight: 700; color: var(--accent); }
  .cal-day .dot { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .cal-day.blank { visibility: hidden; }

  /* 精读 */
  .read-text { font-size: 16px; line-height: 2.05; word-break: break-word; }
  .read-text .w { cursor: pointer; border-radius: 3px; padding: 0 1px; }
  .read-text .w:hover { background: var(--accent-soft); }
  .read-text .w.new { background: #fdf3e3; border-bottom: 1px dashed var(--amber); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
    font-size: 13px; cursor: pointer; background: #fff; font-family: inherit; color: var(--ink);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  /* 影子跟读 */
  .shad-progress { text-align: center; color: var(--ink-2); font-size: 13px; }
  .shad-sentence {
    font-size: 18px; line-height: 1.8; text-align: center;
    padding: 18px 8px 10px; min-height: 64px; font-weight: 600;
  }
  .rate-row { display: flex; gap: 6px; justify-content: center; margin: 6px 0; flex-wrap: wrap; }
  .rate-row .btn { padding: 4px 12px; font-size: 13px; font-weight: 500; }
  .rate-row .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  /* 听力复习 */
  .lr-item { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-top: 10px; background: #fbfcfb; }
  .lr-text { font-size: 15px; line-height: 1.7; filter: blur(5px); user-select: none; transition: filter .2s; }
  .lr-text:hover { filter: blur(2px); }
  .lr-text.show { filter: none; user-select: text; }

  /* 自主加练 */
  .skill-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
  @media (max-width: 560px) { .skill-grid { grid-template-columns: repeat(2, 1fr); } }
  .skill-opt {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
    padding: 16px 8px; cursor: pointer; text-align: center; font-family: inherit;
  }
  .skill-opt:hover { border-color: var(--accent); background: var(--accent-soft); }
  .skill-opt b { font-size: 16px; color: var(--accent); display: block; }
  .skill-opt span { display: block; font-size: 12px; color: var(--ink-2); margin-top: 4px; }

  /* 学习战果登记（步进器） */
  .report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  @media (max-width: 420px) { .report-grid { grid-template-columns: 1fr; } }
  .report-item { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 8px; text-align: center; background: #fbfcfb; }
  .report-label { font-size: 13px; color: var(--ink-2); }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; }
  .step-btn { padding: 2px 12px; font-size: 16px; line-height: 1.3; }
  .step-val { font-size: 20px; color: var(--accent); min-width: 30px; display: inline-block; font-variant-numeric: tabular-nums; }

  /* 统计图表 */
  .chart-svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  /* 生词库：划词弹窗 + 生词条目 + 提示条 */
  .sel-popup {
    position: absolute; z-index: 50; width: 264px;
    background: var(--panel); border: 1px solid var(--accent);
    border-radius: var(--radius); padding: 12px 14px;
    box-shadow: 0 6px 24px rgba(20, 40, 30, .15);
  }
  .sel-word { font-weight: 700; color: var(--accent); font-size: 15px; word-break: break-word; }
  .sel-explain { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; white-space: pre-wrap; max-height: 120px; overflow: auto; }
  .vocab-entry { margin-top: 14px; }
  .vocab-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .vocab-word { font-size: 20px; color: var(--accent); }
  .phonetic { color: var(--ink-2); font-size: 14px; }
  .speak-btn { border: none; background: none; cursor: pointer; font-size: 16px; padding: 0 2px; line-height: 1; }
  .speak-btn:hover { transform: scale(1.15); }
  .mini-label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-top: 10px; margin-bottom: 6px; }
  .ck { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; flex: none; }
  .vocab-sent { font-size: 13px; color: var(--ink-2); font-style: italic; margin: 6px 0 2px; }
  .toast {
    position: fixed; left: 50%; bottom: 36px; z-index: 99;
    transform: translateX(-50%) translateY(10px);
    background: #1d2421; color: #fff; padding: 8px 18px;
    border-radius: 999px; font-size: 13px; opacity: 0; transition: all .25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 雅思式阅读题 */
  .q-block { margin: 4px 0 14px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .q-score { font-size: 13px; font-weight: 600; color: var(--accent); }
  .q-item { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-top: 10px; background: #fbfcfb; }
  .q-title { font-size: 14px; font-weight: 600; }
  .q-opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .q-opt { padding: 6px 14px; font-size: 13px; }
  .q-opt.picked { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .q-sa { width: 100%; min-height: 60px; margin-top: 10px; }
  .q-reveal { margin-top: 8px; }
  .q-ref { margin-top: 8px; font-size: 13px; color: var(--accent); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
  .q-result { margin-top: 8px; font-size: 13px; }
  .q-correct { color: var(--accent); font-weight: 600; }
  .q-wrong { color: var(--red); font-weight: 600; }
  .q-why { display: block; color: var(--ink-2); margin-top: 2px; }

  /* 场景阅读高亮词 */
  .ctx-w { cursor: pointer; border-bottom: 2px solid #f59e0b; padding: 0 1px; } /* 一般难词：橙色下划线 */
  .ctx-w:hover { background: #fdf6ec; }
  .ctx-w.ctx-hard { border-bottom-color: #ef4444; background: #fef2f2; } /* 顽固难词：红色底 */
  .ctx-w.ctx-unknown { border-bottom-width: 3px; } /* 本篇标记「还不熟」：加粗 */
  .ctx-w.ctx-known { border-bottom-color: #c8cfcb; opacity: .55; } /* 本篇标记「认识了」：变灰 */
  /* 场景阅读：点词详情卡固定在页面右侧 */
  .ctx-detail {
    position: fixed; right: 18px; top: 120px; width: 320px; max-height: 70vh; overflow: auto;
    border: 1px solid var(--accent); box-shadow: 0 8px 28px rgba(20,40,30,.16); z-index: 60;
  }
  @media (max-width: 760px) { .ctx-detail { position: static; width: auto; max-height: none; margin-top: 14px; box-shadow: none; } }

  /* 回到顶部 */
  #toTop {
    position: fixed; right: 18px; bottom: 24px; z-index: 70;
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card, #fff); color: var(--ink-2); font-size: 20px; line-height: 1;
    cursor: pointer; box-shadow: 0 4px 14px rgba(20,40,30,.12);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    transform: translateY(8px);
  }
  #toTop.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  #toTop:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button id="toTop" title="回到顶部" aria-label="回到顶部">↑</button>
<script>
// 回到顶部：滚动超过一屏才出现，点击平滑回顶
(function () {
  const b = document.getElementById("toTop");
  const onScroll = () => b.classList.toggle("show", window.scrollY > window.innerHeight * 0.8);
  window.addEventListener("scroll", onScroll, { passive: true });
  b.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
  onScroll();
})();
</script>

<script>
"use strict";

/* ============ 数据层 ============ */
const STORE_KEY = "daily-english.v1";
const REVIEW_STEPS = [0, 1, 3, 7, 16, 35]; // 间隔天数

function todayKey(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function dayNum(key) { return Math.floor(new Date(key + "T00:00:00").getTime() / 86400000); }

function blankState() {
  return { level: null, createdAt: todayKey(), days: {}, cards: [], nextCardId: 1, sessions: [], nextSessionId: 1, vocab: [], nextVocabId: 1, extraSeen: {}, journal: {}, readText: "", readTexts: [], nextReadId: 1, listenReview: [], nextLrId: 1, ctxArticles: [], nextCtxId: 1, activities: [], exportBatches: [], ai: { base: "", key: "", model: "" }, updatedAt: 0 };
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return blankState();
    return Object.assign(blankState(), JSON.parse(raw));
  } catch (e) { return blankState(); }
}
function save() {
  state.updatedAt = Date.now();
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
  if (syncEnabled) {
    // 同步落盘到本地文件，换浏览器/换打开方式都不丢数据
    fetch(SYNC_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) }).catch(() => {});
  }
}
let state = load();

/* ============ 数据落盘同步（proxy.py 提供，可选） ============ */
const SYNC_URL = location.protocol === "file:" ? "http://127.0.0.1:8787/data" : "/data";
let syncEnabled = false;
async function syncPull() {
  try {
    const r = await fetch(SYNC_URL, { cache: "no-store" });
    syncEnabled = true;
    if (!r.ok) return;
    const remote = await r.json();
    if (!remote || typeof remote !== "object" || !remote.days) return;
    if ((remote.updatedAt || 0) > (state.updatedAt || 0)) {
      state = Object.assign(blankState(), remote);
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      render();
    }
  } catch (e) { /* 中转没启动就只存浏览器，不影响使用 */ }
}

/* ============ 任务库：听说读写四项轮换 ============ */
function countWords(text) {
  const m = String(text || "").trim().match(/[A-Za-z0-9']+/g);
  return m ? m.length : 0;
}

/* ============ 本地反馈引擎（离线，零配置） ============ */
function taskFor(level, key, swap = 0) {
  const list = TASKS[level];
  const idx = (dayNum(key) + LEVEL_ORDER.indexOf(level) * 7 + swap) % list.length;
  return list[idx];
}
function getDay(key = todayKey()) {
  return state.days[key];
}
function ensureDay(key = todayKey()) {
  if (!state.days[key]) state.days[key] = { level: state.level, swap: 0, draft: "", done: false, finishedAt: null };
  return state.days[key];
}
function streak() {
  let n = 0;
  for (let i = 0; i < 10000; i++) {
    const d = getDay(todayKey(-i));
    if (d && d.done) n++;
    else if (i === 0) continue; // 今天还没做不打断连击
    else break;
  }
  return n;
}
function totalDone() { return Object.values(state.days).filter(d => d.done).length; }
function doneAtLevel(level) { return Object.values(state.days).filter(d => d.done && d.level === level).length; }
function dueCards() {
  const t = todayKey();
  return state.cards.filter(c => c.due <= t);
}
function nextLevelOf(level) {
  const i = LEVEL_ORDER.indexOf(level);
  return i < LEVEL_ORDER.length - 1 ? LEVEL_ORDER[i + 1] : null;
}

/* ---- 模块时长追踪：精读(eread)/场景阅读(ctx) 停留时长计入统计 ----
   进入对应 tab 开始计时，切走或页面隐藏时结算落库到 state.activities。 */
const TRACKED_TABS = { eread: "精读", ctx: "场景阅读" };
let modTimer = null; // { tab, startedAt }
function trackModuleTime(currentTab) {
  const now = Date.now();
  if (modTimer && modTimer.tab !== currentTab) { // 离开了被追踪的页
    const secs = Math.round((now - modTimer.startedAt) / 1000);
    if (secs >= 5) { // 至少 5 秒才记，防误触
      state.activities = state.activities || [];
      state.activities.push({ date: todayKey(), module: TRACKED_TABS[modTimer.tab], secs, at: new Date(modTimer.startedAt).toISOString() });
      save();
    }
    modTimer = null;
  }
  if (TRACKED_TABS[currentTab] && !modTimer) modTimer = { tab: currentTab, startedAt: now };
}
// 页面切后台/关闭时结算
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && modTimer) {
    const secs = Math.round((Date.now() - modTimer.startedAt) / 1000);
    if (secs >= 5) {
      state.activities = state.activities || [];
      state.activities.push({ date: todayKey(), module: TRACKED_TABS[modTimer.tab], secs, at: new Date(modTimer.startedAt).toISOString() });
      save();
    }
    modTimer.startedAt = Date.now(); // 回来时重新起算，不把挂后台时间算进去
  } else if (document.visibilityState === "visible" && modTimer) {
    modTimer.startedAt = Date.now();
  }
});

/* ---- 生词库：阅读划词入库 → 独立页精加工（解释→造句→点评→逐条存学习库） ---- */
function speakText(text, rate = 0.9) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ---- 影子跟读 / 精读 工具 ---- */
function splitSentences(text) {
  const parts = String(text).match(/[^.!?…]+[.!?…]+["'”’)\]]?\s*/g);
  return (parts || [String(text)]).map(s => s.trim()).filter(Boolean);
}
function speakOnce(text, rate, onend) {
  if (!window.speechSynthesis) { if (onend) onend(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  if (v) u.voice = v;
  u.onend = () => { if (onend) onend(); };
  u.onerror = () => { if (onend) onend(); };
  speechSynthesis.speak(u);
}
// opts: { timeoutMs 单次请求超时（默认 120s，生成类可传更长）、retries 失败重试次数（默认 2）、retryDelayMs 重试间隔 }
async function aiChat(messages, opts) {
  const ai = state.ai || {};
  if (!ai.base || !ai.model || (!ai.key && !/^(\/|https?:\/\/(127\.0\.0\.1|localhost))/i.test(ai.base))) {
    throw new Error("先在「记录」页配置 AI 接口");
  }
  const o = Object.assign({ timeoutMs: 120000, retries: 2, retryDelayMs: 1500 }, opts || {});
  const headers = { "Content-Type": "application/json" };
  if (ai.key) headers["Authorization"] = "Bearer " + ai.key;
  const url = ai.base.replace(/\/+$/, "") + "/chat/completions";
  let lastErr = null;
  for (let attempt = 0; attempt <= o.retries; attempt++) {
    if (attempt > 0) await new Promise(r => setTimeout(r, o.retryDelayMs));
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), o.timeoutMs);
    try {
      const resp = await fetch(url, {
        method: "POST", headers, signal: ctrl.signal,
        body: JSON.stringify({ model: ai.model, messages }),
      });
      clearTimeout(timer);
      if (!resp.ok) {
        const status = resp.status;
        const body = (await resp.text()).slice(0, 120);
        // 502/503/504/超时这类网关/超时错误值得重试；4xx 鉴权/参数错误重试无意义
        const retryable = status >= 500 || status === 408 || status === 429;
        const err = new Error("HTTP " + status + " " + body);
        if (!retryable) throw err;
        lastErr = err;
        continue;
      }
      const data = await resp.json();
      const text = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
      if (!text.trim()) { lastErr = new Error("AI 返回了空内容"); continue; }
      return text;
    } catch (e) {
      clearTimeout(timer);
      if (e.name === "AbortError") { lastErr = new Error(`请求超时（>${Math.round(o.timeoutMs / 1000)}s），正在重试`); continue; }
      if (e.message && /^HTTP 4\d\d/.test(e.message)) throw e; // 4xx 不重试
      lastErr = e; // 网络错误也重试
    }
  }
  throw lastErr || new Error("AI 请求失败");
}

function isCommonWord(w) {
  w = w.toLowerCase();
  if (COMMON_WORDS.has(w)) return true;
  for (const suf of ["'s", "s", "es", "ed", "ing", "ly", "er", "est", "ies"]) {

}
