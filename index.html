<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每天用英语 · Daily English</title>
<style>
  :root {
    --bg: #f6f7f6;
    --panel: #ffffff;
    --ink: #1d2421;
    --ink-2: #5c6660;
    --line: #e3e7e4;
    --accent: #17795b;
    --accent-soft: #e4f2ec;
    --amber: #d97b1e;
    --red: #c2483d;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    line-height: 1.6; min-height: 100vh;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 80px; }

  header.top {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0 16px; flex-wrap: wrap;
  }
  header.top h1 { font-size: 18px; font-weight: 700; letter-spacing: 0; }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 11px; font-size: 13px; color: var(--ink-2);
  }
  .pill.streak b { color: var(--amber); font-size: 14px; }
  .pill.level { cursor: pointer; font-weight: 600; color: var(--accent); }
  .pill.level:hover { border-color: var(--accent); }

  nav.tabs {
    display: flex; gap: 4px; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 4px; margin-bottom: 18px;
  }
  nav.tabs button {
    flex: 1; border: none; background: none; padding: 8px 4px;
    font-size: 14px; color: var(--ink-2); border-radius: 6px; cursor: pointer;
    font-family: inherit;
  }
  nav.tabs button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav.tabs .badge {
    display: inline-block; min-width: 17px; text-align: center;
    background: var(--red); color: #fff; border-radius: 999px;
    font-size: 11px; padding: 0 5px; margin-left: 4px; line-height: 17px;
  }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px;
  }
  .card + .card { margin-top: 14px; }

  .task-type {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); border-radius: 999px; padding: 2px 10px;
  }
  .task-cn { font-size: 19px; font-weight: 700; margin: 12px 0 6px; }
  .task-en { color: var(--ink-2); font-size: 15px; font-style: italic; }
  .task-meta { margin-top: 12px; font-size: 13px; color: var(--ink-2); }

  textarea {
    width: 100%; min-height: 140px; resize: vertical;
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; font-size: 15px; font-family: inherit;
    background: #fbfcfb; color: var(--ink); line-height: 1.6;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  input[type=text] {
    width: 100%; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 9px 12px; font-size: 14px; font-family: inherit; background: #fbfcfb;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: var(--radius); padding: 10px 18px; font-size: 14px;
    cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .btn:hover { border-color: #c8cfcb; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #12644c; }
  .btn.ghost { border-color: transparent; color: var(--ink-2); font-weight: 500; }
  .btn.ghost:hover { background: #eff1ef; }
  .btn.danger { color: var(--red); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

  .wordcount { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
  .wordcount b { color: var(--accent); }

  .timer { font-size: 40px; font-weight: 700; text-align: center; padding: 18px 0 4px; font-variant-numeric: tabular-nums; }
  .timer-label { text-align: center; color: var(--ink-2); font-size: 13px; margin-bottom: 8px; }

  .done-hero { text-align: center; padding: 26px 10px; }
  .done-hero .big { font-size: 42px; }
  .done-hero h2 { font-size: 20px; margin: 8px 0 4px; }
  .done-hero p { color: var(--ink-2); font-size: 14px; }

  .banner {
    border: 1px solid #f0d9b8; background: #fdf6ec; color: #7a5210;
    border-radius: var(--radius); padding: 12px 16px; font-size: 14px;
    margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .banner .btn { padding: 5px 12px; font-size: 13px; }

  .review-q { font-size: 20px; font-weight: 700; text-align: center; padding: 24px 8px 6px; }
  .review-ctx { text-align: center; color: var(--ink-2); font-size: 14px; padding-bottom: 10px; }
  .review-a {
    text-align: center; font-size: 18px; color: var(--accent); font-weight: 600;
    padding: 14px 8px; border-top: 1px dashed var(--line);
  }
  .grade-row { display: flex; gap: 8px; }
  .grade-row .btn { flex: 1; }

  ul.list { list-style: none; }
  ul.list li {
    display: flex; align-items: baseline; gap: 10px;
    padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  ul.list li:last-child { border-bottom: none; }
  ul.list .en { font-weight: 600; }
  ul.list .zh { color: var(--ink-2); flex: 1; }
  ul.list .due { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  ul.list .due.today { color: var(--red); font-weight: 600; }

  .hist-item { border-bottom: 1px solid var(--line); padding: 12px 2px; }
  .hist-item:last-child { border-bottom: none; }
  .hist-head { display: flex; gap: 10px; align-items: baseline; font-size: 13px; color: var(--ink-2); }
  .hist-head b { color: var(--ink); font-size: 14px; }
  .hist-text {
    margin-top: 6px; font-size: 14px; color: var(--ink);
    background: #fbfcfb; border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; white-space: pre-wrap; word-break: break-word;
  }

  .empty { text-align: center; color: var(--ink-2); padding: 30px 10px; font-size: 14px; }
  .hint { font-size: 13px; color: var(--ink-2); margin-top: 8px; }
  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

  ul.tips { list-style: none; margin-top: 10px; }
  ul.tips li {
    padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 8px; font-size: 14px; background: #fbfcfb;
  }
  ul.tips .tip-zh { font-weight: 600; }
  ul.tips .tip-en { color: var(--accent); font-weight: 600; margin-top: 2px; }
  ul.tips .tip-ctx { color: var(--ink-2); font-size: 13px; margin-top: 2px; font-style: italic; }
  ul.tips .btn { padding: 4px 12px; font-size: 12px; margin-top: 6px; }
  ul.tips .saved-mark { font-size: 12px; color: var(--accent); margin-top: 6px; display: inline-block; }
  .tag-fb {
    font-size: 11px; background: #fbe9e7; color: var(--red);
    border-radius: 4px; padding: 0 6px; margin-right: 2px; white-space: nowrap;
  }
  .ai-status { font-size: 13px; color: var(--ink-2); margin-top: 8px; }

  /* onboarding */
  .level-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  @media (max-width: 520px) { .level-grid { grid-template-columns: 1fr; } }
  .level-opt {
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); padding: 14px; cursor: pointer; text-align: left;
    font-family: inherit;
  }
  .level-opt:hover { border-color: var(--accent); }
  .level-opt b { font-size: 16px; color: var(--accent); }
  .level-opt p { font-size: 13px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; }

  .stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; text-align: center;
  }
  .stat b { display: block; font-size: 24px; color: var(--accent); }
  .stat span { font-size: 12px; color: var(--ink-2); }
  .stat.amber b { color: var(--amber); }

  /* 自主加练 */
  .skill-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
  @media (max-width: 560px) { .skill-grid { grid-template-columns: repeat(2, 1fr); } }
  .skill-opt {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
    padding: 16px 8px; cursor: pointer; text-align: center; font-family: inherit;
  }
  .skill-opt:hover { border-color: var(--accent); background: var(--accent-soft); }
  .skill-opt b { font-size: 16px; color: var(--accent); display: block; }
  .skill-opt span { display: block; font-size: 12px; color: var(--ink-2); margin-top: 4px; }

  /* 学习战果登记（步进器） */
  .report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  @media (max-width: 420px) { .report-grid { grid-template-columns: 1fr; } }
  .report-item { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 8px; text-align: center; background: #fbfcfb; }
  .report-label { font-size: 13px; color: var(--ink-2); }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; }
  .step-btn { padding: 2px 12px; font-size: 16px; line-height: 1.3; }
  .step-val { font-size: 20px; color: var(--accent); min-width: 30px; display: inline-block; font-variant-numeric: tabular-nums; }

  /* 统计图表 */
  .chart-svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  /* 生词库：划词弹窗 + 生词条目 + 提示条 */
  .sel-popup {
    position: absolute; z-index: 50; width: 264px;
    background: var(--panel); border: 1px solid var(--accent);
    border-radius: var(--radius); padding: 12px 14px;
    box-shadow: 0 6px 24px rgba(20, 40, 30, .15);
  }
  .sel-word { font-weight: 700; color: var(--accent); font-size: 15px; word-break: break-word; }
  .sel-explain { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; white-space: pre-wrap; max-height: 120px; overflow: auto; }
  .vocab-entry { margin-top: 14px; }
  .vocab-word { font-size: 20px; color: var(--accent); }
  .vocab-sent { font-size: 13px; color: var(--ink-2); font-style: italic; margin: 6px 0 2px; }
  .toast {
    position: fixed; left: 50%; bottom: 36px; z-index: 99;
    transform: translateX(-50%) translateY(10px);
    background: #1d2421; color: #fff; padding: 8px 18px;
    border-radius: 999px; font-size: 13px; opacity: 0; transition: all .25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";

/* ============ 数据层 ============ */
const STORE_KEY = "daily-english.v1";
const LEVEL_ORDER = ["A1", "A2", "B1", "B2", "C1", "C2"];
const LEVELS = {
  A1: { label: "A1 入门",  desc: "能写简单句子，介绍自己、日常物品", words: 15,  secs: 60 },
  A2: { label: "A2 基础",  desc: "能讲过去的事、写简单邮件和回复", words: 30,  secs: 90 },
  B1: { label: "B1 进阶",  desc: "能表达观点、描述经历、处理日常沟通", words: 50,  secs: 120 },
  B2: { label: "B2 独立",  desc: "能有理有据地争论、写工作邮件", words: 80,  secs: 150 },
  C1: { label: "C1 流利",  desc: "能即兴演讲、写有说服力的长文", words: 120, secs: 180 },
  C2: { label: "C2 精通",  desc: "能玩转风格、幽默和精准辨析", words: 150, secs: 180 },
};
const REVIEW_STEPS = [0, 1, 3, 7, 16, 35]; // 间隔天数

function todayKey(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function dayNum(key) { return Math.floor(new Date(key + "T00:00:00").getTime() / 86400000); }

function blankState() {
  return { level: null, createdAt: todayKey(), days: {}, cards: [], nextCardId: 1, sessions: [], nextSessionId: 1, vocab: [], nextVocabId: 1, extraSeen: {}, ai: { base: "", key: "", model: "" }, updatedAt: 0 };
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return blankState();
    return Object.assign(blankState(), JSON.parse(raw));
  } catch (e) { return blankState(); }
}
function save() {
  state.updatedAt = Date.now();
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
  if (syncEnabled) {
    // 同步落盘到本地文件，换浏览器/换打开方式都不丢数据
    fetch(SYNC_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) }).catch(() => {});
  }
}
let state = load();

/* ============ 数据落盘同步（proxy.py 提供，可选） ============ */
const SYNC_URL = location.protocol === "file:" ? "http://127.0.0.1:8787/data" : "/data";
let syncEnabled = false;
async function syncPull() {
  try {
    const r = await fetch(SYNC_URL, { cache: "no-store" });
    syncEnabled = true;
    if (!r.ok) return;
    const remote = await r.json();
    if (!remote || typeof remote !== "object" || !remote.days) return;
    if ((remote.updatedAt || 0) > (state.updatedAt || 0)) {
      state = Object.assign(blankState(), remote);
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      render();
    }
  } catch (e) { /* 中转没启动就只存浏览器，不影响使用 */ }
}

/* ============ 任务库：听说读写四项轮换 ============ */
const TASKS = {
  A1: [
    { t: "写", cn: "用英语写 3 句自我介绍：名字、城市、一个爱好", en: "Introduce yourself in 3 sentences: name, city, one hobby." },
    { t: "听", cn: "听两遍（不看原文），说出或写下 Anna 早上做的三件事", en: "Listen twice without reading. What three things does Anna do in the morning?",
      passage: "Hi, I'm Anna. I live in Beijing. Every morning I get up at seven. I drink coffee and eat bread. Then I go to work by bus." },
    { t: "说", cn: "看着你的桌子，大声说出 5 样东西：There is a ...", en: "Look at your desk. Say 5 things out loud: 'There is a ...'" },
    { t: "读", cn: "读这封便条，然后用英语说出或写下：什么时候、在哪里、带什么", en: "Read the note, then say or write: when, where, and what to bring.",
      passage: "Dear Tom, the meeting is at 3 pm on Friday, in Room 202. Please bring your laptop. See you there. — Lisa" },
    { t: "写", cn: "你今天吃了什么？写下来（可以配表情吐槽）", en: "What did you eat today? Write it down." },
    { t: "听", cn: "听两遍，记下店里三种水果和苹果的价格", en: "Listen twice. Write down the three fruits and the price of apples.",
      passage: "Welcome to my shop. We have apples, bananas, and oranges. The apples are red and sweet. One kilo of apples is five yuan." },
    { t: "说", cn: "描述今天的天气和你穿的衣服", en: "Describe today's weather and what you are wearing." },
    { t: "读", cn: "读完这段自我介绍，仿照它写或说两句关于你自己", en: "Read this self-introduction, then say two similar sentences about yourself.",
      passage: "My name is Marco. I am from Italy. I am a teacher. I like music and football. On Sundays I play football with my friends." },
    { t: "写", cn: "给家人或朋友发一条英文消息，真的发出去", en: "Send a real English message to a friend or family member." },
    { t: "听", cn: "听两遍：今天天气怎么样？明天呢？说话人打算怎么办？", en: "Listen twice. How is the weather today and tomorrow? What will the speaker do?",
      passage: "Today is Monday. It is sunny and hot. I wear a T-shirt and shorts. But tomorrow it will rain, so I will take an umbrella." },
    { t: "说", cn: "说出你一天的时间表：I get up at ...", en: "Say your daily schedule out loud." },
    { t: "读", cn: "读这份咖啡店菜单，用英语点一单：你要什么、一共多少钱", en: "Read the menu, then order in English: what do you want and how much is it?",
      passage: "Welcome to Sun Cafe. Coffee is three dollars. Tea is two dollars. We also have cakes. The chocolate cake is four dollars. It is very popular." },
  ],
  A2: [
    { t: "写", cn: "昨天你做了什么？写 4-5 句（过去式）", en: "What did you do yesterday? 4-5 sentences, past tense." },
    { t: "听", cn: "听两遍留言：电影几点开始？几点见面？还要带什么？", en: "Listen twice. When does the movie start? When do they meet? What should Sam bring?",
      passage: "Hi Sam, it's me. About tomorrow — the movie starts at eight, not seven. Let's meet at the cinema at seven forty-five. Oh, and bring a jacket, it will be cold." },
    { t: "说", cn: "讲一部你看过的电影或剧：讲了什么、你喜不喜欢", en: "Talk about a movie or show you watched." },
    { t: "读", cn: "读这封邀请邮件，然后写或说一条回复：去还是不去，为什么", en: "Read the invitation, then reply: will you go or not, and why?",
      passage: "Hi everyone, I'm having a birthday dinner this Saturday at 7 pm at Green Garden Restaurant. Please tell me before Thursday if you can come. — Mia" },
    { t: "写", cn: "给朋友写封邮件，推荐一家你去过的餐厅", en: "Write an email recommending a restaurant to a friend." },
    { t: "听", cn: "听两遍指路，不看原文复述：先怎么走、在哪转弯、邮局在哪", en: "Listen twice, then repeat the route without reading.",
      passage: "Go straight for two minutes, then turn left at the bank. The post office is on your right, next to a small park." },
    { t: "说", cn: "比较两个季节或两个你住过的地方，哪个更好", en: "Compare two seasons or two places you lived in." },
    { t: "读", cn: "读这条差评：一句话总结她为什么不满，再写一句你会问卖家的问题", en: "Read the review: why is she unhappy? What would you ask the seller?",
      passage: "I bought this bag last month. It looks nice and it is cheap. But after two weeks, the handle broke. I don't think I will buy from this brand again." },
    { t: "写", cn: "回复一条邀请：接受或礼貌拒绝（编一个也行）", en: "Reply to an invitation: accept or politely decline." },
    { t: "听", cn: "听两遍周末计划：周六上午、下午、周日分别做什么？", en: "Listen twice. What happens Saturday morning, afternoon, and Sunday?",
      passage: "This weekend I want to try something new. On Saturday morning I will take a cooking class. In the afternoon, I'm going to visit my grandmother. Sunday is for rest — maybe a long walk by the river." },
    { t: "说", cn: "描述你每天上班/上学的路线", en: "Describe your daily commute route." },
    { t: "读", cn: "读这个做法，然后用英语说出制作冷萃咖啡的三个步骤", en: "Read it, then say the three steps of making cold brew in English.",
      passage: "To make cold brew coffee, put fifty grams of ground coffee in a jar. Add five hundred milliliters of cold water. Wait twelve hours in the fridge. Then filter it and enjoy." },
  ],
  B1: [
    { t: "写", cn: "今天发生的一件有意思（或离谱）的事", en: "Write about one interesting thing that happened today." },
    { t: "听", cn: "听两遍：他遇到了什么问题？他还没做什么？听完给出你的一条建议", en: "Listen twice. What is his problem? What hasn't he done yet? Then give one piece of advice.",
      passage: "I'm a bit stressed this week. My manager gave me a big project on Monday, and the deadline is Friday. The problem is, two people from my team are on holiday, so I have to do everything myself. I haven't told my manager yet." },
    { t: "说", cn: "你怎么看远程办公？说 2 分钟你的真实想法", en: "Your honest take on remote work, 2 minutes." },
    { t: "读", cn: "读这段谈习惯的短文：一句话总结作者观点，再说一个你同不同意的理由", en: "Summarize the author's point in one sentence, then say if you agree.",

/* ============ 工具 ============ */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function countWords(text) {
  const m = String(text || "").trim().match(/[A-Za-z0-9']+/g);
  return m ? m.length : 0;
}

/* ============ 本地反馈引擎（离线，零配置） ============ */
const STOP = new Set(("the,a,an,and,or,but,so,because,if,i,you,he,she,it,we,they,is,are,was,were,am,be,been,being," +
  "do,does,did,have,has,had,will,would,can,could,should,shall,to,of,in,on,at,for,with,about,as,by,from,up,out,off," +
  "that,this,these,those,there,here,my,your,his,her,its,our,their,me,him,us,them,not,no,very,really,just,also,too," +
  "when,what,where,who,whom,how,which,than,then,some,any,all,each,every,both,few,more,most,other,own,same,only").split(","));

// 中国学习者高频错误模式：命中原句 → 正确说法
const FEEDBACK_RULES = [
  { re: /\bi am agree\b/i, zh: "「I am agree」→ agree 本身就是动词，前面不加 am", en: "I agree." },
  { re: /\bmore (better|easier|worse|faster|slower|bigger|smaller|cheaper|happier|simpler)\b/i, zh: "比较级前不用 more", en: "more better → better（-er 结尾的词本身已是比较级）" },
  { re: /\b(he|she|it) don't\b/i, zh: "第三人称单数：he/she/it 后面用 doesn't", en: "he doesn't / she doesn't / it doesn't" },
  { re: /\bpeople (is|was|has)\b/i, zh: "people 是复数", en: "people are / people were / people have" },
  { re: /\b(informations|advices|feedbacks|homeworks|equipments|knowledges|furnitures|stuffs)\b/i, zh: "不可数名词没有复数形式", en: "information / advice / feedback / homework / equipment / knowledge / furniture / stuff" },
  { re: /\bi very like\b/i, zh: "「I very like」是中式语序", en: "I really like … / I like it very much" },
  { re: /\bin the internet\b/i, zh: "上网用 on，不用 in", en: "on the internet" },
  { re: /\baccording to me\b/i, zh: "「according to me」不地道", en: "in my opinion / from my perspective / I think" },
  { re: /\bopen the (light|tv|computer|phone)\b/i, zh: "开电器用 turn on", en: "turn on the light / turn on the TV" },
  { re: /\bhave (went|did|saw|ate|came|took|wrote|spoke|bought|made)\b/i, zh: "have 后面要接过去分词", en: "have gone / have done / have seen / have eaten" },
  { re: /\byesterday\b[^.!?]{0,50}\bhave\b|\bhave\b[^.!?]{0,50}\byesterday\b/i, zh: "有 yesterday 时用一般过去时，不用 have", en: "I did it yesterday.（不是 I have done it yesterday）" },
  { re: /\balthough\b[^.!?]{0,120}\bbut\b/i, zh: "although 和 but 一个句子里只用一个", en: "Although it rained, I went out. / It rained, but I went out." },
  { re: /\bbecause\b[^.!?]{0,120}\bso\b/i, zh: "because 和 so 一个句子里只用一个", en: "Because I was tired, I slept early. / I was tired, so I slept early." },
  { re: /\bplay (the )?phone\b/i, zh: "「玩手机」不是 play phone", en: "use my phone / be on my phone" },
  { re: /\bhow to say\b/i, zh: "卡壳时说 how to say 不太地道", en: "how should I put it / what's the word" },
];

const LINK_WORDS = /\b(however|because|although|though|but|so|then|also|for example|for instance|in addition|first|second|finally|instead|therefore|besides|actually)\b/i;

function analyzeWriting(text, level) {
  const tips = [];
  const lv = LEVELS[level] || LEVELS.B1;
  const words = text.match(/[A-Za-z']+/g) || [];
  const wc = words.length;
  const sentences = text.split(/[.!?…]+/).map(s => s.trim()).filter(Boolean);

  for (const r of FEEDBACK_RULES) {
    const m = text.match(r.re);
    if (m) tips.push({ zh: r.zh, en: r.en, ctx: "「" + m[0].slice(0, 120) + "」" });
  }
  const badCap = sentences.find(s => /^[a-z]/.test(s));
  if (badCap) tips.push({ zh: "句首字母要大写", en: badCap[0].toUpperCase() + badCap.slice(1, 60) + (badCap.length > 60 ? "…" : ""), ctx: "「" + badCap.slice(0, 60) + "」" });
  const mi = text.match(/(^|[\s("'])i([\s,.!?;:'")]|$)/);
  if (mi) tips.push({ zh: "「我」永远大写为 I", en: "I", ctx: "" });
  if (wc > 0 && wc < lv.words) {
    tips.push({ zh: `长度：写了 ${wc} 词，${lv.label.split(" ")[0]} 目标是 ${lv.words} 词。试着多补一个原因或一个细节`, en: "", ctx: "" });
  }
  const freq = {};
  words.map(w => w.toLowerCase()).forEach(w => { if (!STOP.has(w) && w.length > 3) freq[w] = (freq[w] || 0) + 1; });
  const top = Object.entries(freq).sort((a, b) => b[1] - a[1])[0];
  if (top && top[1] >= 4) tips.push({ zh: `「${top[0]}」出现了 ${top[1]} 次，试试换个说法或用代词`, en: "", ctx: "" });
  const longS = sentences.find(s => countWords(s) > 28);
  if (longS) tips.push({ zh: "有一句超过 28 个词，拆成两句更自然", en: "", ctx: "「" + longS.slice(0, 100) + "…」" });
  if (sentences.length >= 3 && !LINK_WORDS.test(text)) {
    tips.push({ zh: "通篇没有连接词，加一两个 because / but / however 会更连贯", en: "because / but / however / for example", ctx: "" });
  }
  if (wc >= lv.words && LINK_WORDS.test(text) && !tips.length) {
    tips.push({ zh: `${wc} 词达标，连接词也用上了，今天状态不错`, en: "", ctx: "", praise: true });
  }
  return tips;
}

function addCard(en, zh, ctx, type = "expr") {
  state.cards.push({ id: state.nextCardId++, en, zh, ctx, type, step: 0, due: todayKey(), added: todayKey() });
}

/* ============ AI 深度点评（可选，兼容 OpenAI 格式接口） ============ */
async function runAiReview(day, btn) {
  const ai = state.ai || {};
  if (!ai.base || !ai.model || (!ai.key && !/^(\/|https?:\/\/(127\.0\.0\.1|localhost))/i.test(ai.base))) {
    alert("先在「记录」页配置 AI 接口：地址和模型必填，本机地址可不填 Key");
    return;
  }
  const localBase = /^(\/|https?:\/\/(127\.0\.0\.1|localhost))/i.test(ai.base);
  if (location.protocol === "file:" && localBase) {
    alert("AI 点评需要在本机中转地址下使用：请打开 http://127.0.0.1:8787/ （开机自启的入口就是它）");
    return;
  }
  btn.disabled = true; btn.textContent = "点评中…";
  try {
    const headers = { "Content-Type": "application/json" };
    if (ai.key) headers["Authorization"] = "Bearer " + ai.key;
    const resp = await fetch(ai.base.replace(/\/+$/, "") + "/chat/completions", {
      method: "POST",
      headers,
      body: JSON.stringify({
        model: ai.model,
        messages: [
          { role: "system", content: "你是英语写作教练。用户每天用英语写一小段话。给出 2-4 条最关键的反馈（语法、用词、地道度），每条一行，格式严格为：中文问题简述 || 正确或更地道的英文表达。不要输出任何其他内容。" },
          { role: "user", content: "用户级别：" + state.level + "\n\n用户的英语文本：\n" + day.draft },
        ],
      }),
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status + " " + (await resp.text()).slice(0, 120));
    const data = await resp.json();
    const text = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
    const tips = text.split(/\n+/).map(l => l.replace(/^[-*\d.\s、]+/, "")).filter(l => l.includes("||"))
      .map(l => { const p = l.split("||").map(s => s.trim()); return { zh: p[0], en: p[1] || "", ctx: "" }; });
    if (!tips.length) throw new Error("AI 返回的格式无法解析");
    day.feedback = (day.feedback || []).concat(tips);
    save(); render();
  } catch (e) {
    // HTTP 错误说明中转和鉴权都通了，是模型侧拒绝了参数；网络级错误才是中转没起来
    const isHttpError = /^HTTP \d/.test(e.message);
    const hint = isHttpError
      ? "接口已连通，以上是模型返回的错误，按其提示调整配置即可。"
      : localBase
      ? "本机中转（127.0.0.1:8787）没响应。它已设置开机自启；如果刚开机稍等几秒刷新重试，仍不行就到项目目录运行 python proxy.py 手动拉起。"
      : "网络不通、地址写错或跨域被拦截。";
    alert("AI 点评失败：" + e.message + "\n\n" + hint);
    btn.disabled = false; btn.textContent = "AI 深度点评";
  }
}

  return `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="section-title" style="margin:0">本次反馈</div>
        <button class="btn ghost" id="aiBtn">AI 深度点评</button>
      </div>
      <p class="hint" style="margin-top:2px">有价值的反馈存成复习点，明天起进入复习队列（也可随表达库一起导给 SuperMemo）。</p>
      <ul class="tips">
        ${tips.map((t, i) => `
          <li>
            <div class="tip-zh">${t.praise ? "🌟 " : ""}${esc(t.zh)}</div>
            ${t.en ? `<div class="tip-en">→ ${esc(t.en)}</div>` : ""}
            ${t.ctx ? `<div class="tip-ctx">${esc(t.ctx)}</div>` : ""}
            ${t.en && !t.saved ? `<button class="btn" data-tipidx="${i}">存为复习点</button>` : ""}
            ${t.saved ? `<span class="saved-mark">已存 ✓</span>` : ""}
          </li>`).join("")}
      </ul>
    </div>`;
}
function bindFeedback(root, day) {
  root.querySelectorAll("[data-tipidx]").forEach(b =>
    b.addEventListener("click", () => {
      const t = day.feedback[Number(b.dataset.tipidx)];
      addCard(t.en, t.zh, t.ctx, "fb");
      t.saved = true; save(); render();
    }));
  const aiBtn = $("#aiBtn", root);
  if (aiBtn) aiBtn.addEventListener("click", () => runAiReview(day, aiBtn));
}
function taskFor(level, key, swap = 0) {
  const list = TASKS[level];
  const idx = (dayNum(key) + LEVEL_ORDER.indexOf(level) * 7 + swap) % list.length;
  return list[idx];
}
function getDay(key = todayKey()) {
  return state.days[key];
}
function ensureDay(key = todayKey()) {
  if (!state.days[key]) state.days[key] = { level: state.level, swap: 0, draft: "", done: false, finishedAt: null };
  return state.days[key];
}
function streak() {
  let n = 0;
  for (let i = 0; i < 10000; i++) {
    const d = getDay(todayKey(-i));
    if (d && d.done) n++;
    else if (i === 0) continue; // 今天还没做不打断连击
    else break;
  }
  return n;
}
function totalDone() { return Object.values(state.days).filter(d => d.done).length; }
function doneAtLevel(level) { return Object.values(state.days).filter(d => d.done && d.level === level).length; }
function dueCards() {
  const t = todayKey();
  return state.cards.filter(c => c.due <= t);
}
function nextLevelOf(level) {
  const i = LEVEL_ORDER.indexOf(level);
  return i < LEVEL_ORDER.length - 1 ? LEVEL_ORDER[i + 1] : null;
}

const SKILL_BADGE = { "听": "🎧 听力", "说": "🎙 开口说", "读": "📖 阅读", "写": "✍️ 动笔写" };
const SPEECH_RATE = { A1: 0.7, A2: 0.8, B1: 0.9, B2: 1, C1: 1, C2: 1.05 };

/* ============ 渲染 ============ */
let tab = "today";
let review = null; // {queue:[card], idx, showA}
let extraPick = null; // 自主加练进行中：{skill, idx, startedAt, draft}
let extraDone = null; // 刚完成的加练会话，停留在战果登记页

function render() {
  const app = $("#app");
  if (!state.level) { app.innerHTML = viewOnboarding(); bindOnboarding(); return; }

  const s = streak();
  const due = dueCards().length;
  const vp = (state.vocab || []).filter(v => !(v.example || "").trim()).length; // 待造句的生词数
  app.innerHTML = `
    <header class="top">
      <h1>每天用英语</h1>
      <div class="spacer"></div>
      <span class="pill streak">🔥 连续 <b>${s}</b> 天</span>

    </header>
    <nav class="tabs">
      <button data-tab="today" class="${tab === "today" ? "active" : ""}">今天</button>
      <button data-tab="extra" class="${tab === "extra" ? "active" : ""}">加练</button>
      <button data-tab="review" class="${tab === "review" ? "active" : ""}">复习${due ? `<span class="badge">${due}</span>` : ""}</button>
      <button data-tab="cards" class="${tab === "cards" ? "active" : ""}">表达库</button>
      <button data-tab="vocab" class="${tab === "vocab" ? "active" : ""}">生词库${vp ? `<span class="badge">${vp}</span>` : ""}</button>
      <button data-tab="stats" class="${tab === "stats" ? "active" : ""}">统计</button>
      <button data-tab="me" class="${tab === "me" ? "active" : ""}">记录</button>
    </nav>
    <main id="main"></main>`;

  app.querySelectorAll("nav.tabs button").forEach(b =>
    b.addEventListener("click", () => { tab = b.dataset.tab; if (tab !== "review") review = null; render(); }));
  $("#levelBtn").addEventListener("click", changeLevel);

  const main = $("#main");
  if (tab === "today") renderToday(main);
  else if (tab === "extra") renderExtra(main);
  else if (tab === "review") renderReview(main);

/* ---- 首次：选级别 ---- */
function viewOnboarding() {
  return `
    <div class="card" style="margin-top:40px">
      <h1 style="font-size:22px">每天用英语</h1>
      <p class="hint" style="margin-top:8px">这不是学英语的工具，是<b>用英语</b>的工具。<br>

function bindOnboarding() {

/* ---- 今天 ---- */
function renderToday(main) {
  const key = todayKey();
  const day = ensureDay(key);
  save();
  const lv = LEVELS[state.level];
  const task = taskFor(state.level, key, day.swap || 0);

  if (nl && doneAtLevel(state.level) >= 14) {

      </div>`;
  }

  if (day.done) {
    main.innerHTML = upgradeBanner + `
      <div class="card done-hero">
        <div class="big">✅</div>
        <h2>今天已经用过了</h2>
        <p>连续 ${streak()} 天${day.secs ? " · 用时 " + fmtMins(day.secs) : ""} · 明天开机还会见到我</p>
        <div class="btn-row" style="justify-content:center">
          <button class="btn" id="goExtra">意犹未尽？去加练</button>

        <div class="section-title">顺手留一条表达？</div>

    bindQuickAdd(main);

  const metaText =

    task.t === "写" ? `目标 ≥ ${lv.words} 个词 · 写完打卡` :

    <div class="card">
      <div class="row" style="justify-content:space-between">

  const area = $("#doArea");

function renderWriteArea(area, day, lv, task, extra) {
  area.innerHTML = `
    <textarea id="draft" placeholder="直接写，别查词典，先写完再说……">${esc(day.draft || "")}</textarea>

  const wc = $("#wc");
  const upd = () => {
    const n = countWords(ta.value);

  ta.addEventListener("input", () => { day.draft = ta.value; save(); upd(); });

    day.draft = ta.value;

    finishDaily(day, task, 0);
  });
}

function renderSpeakArea(area, day, task, extra) {
  area.innerHTML = `

function renderListenArea(area, day, task, extra) {
  const rate = SPEECH_RATE[state.level] || 1;

    <div class="row" style="justify-content:center;gap:12px;margin:4px 0 2px">

    <div class="btn-row">

  const upd = () => {

    day.draft = ta.value;
    if (extra) { finishExtra(day, task, 0); return; }

/* ---- 完成与计时 ---- */
function computeSecs(rec, timerSecs) {
  const elapsed = rec.startedAt ? Math.round((Date.now() - rec.startedAt) / 1000) : 0;
  const t = Number(timerSecs) || 0;
  // 开口任务优先用计时器（真实开口时长）；其余用页面停留时长，上限 4 小时防挂机
  const v = t > 0 ? t : elapsed;
  return Math.min(v, 4 * 3600);
}
function finishDaily(day, task, timerSecs) {
  day.secs = computeSecs(day, timerSecs);
  delete day.startedAt;
  day.done = true; day.skill = task.t; day.finishedAt = new Date().toISOString();
  if (countWords(day.draft) >= 5) day.feedback = analyzeWriting(day.draft, state.level);
  save(); render();
}
function finishExtra(rec, task, timerSecs) {
  state.nextSessionId = state.nextSessionId || (state.sessions.length + 1);
  const s = {
    id: state.nextSessionId++,
    date: todayKey(),
    skill: task.t,
    secs: computeSecs(rec, timerSecs),
    nw: 0, np: 0, ns: 0,
    draft: rec.draft || "",
    finishedAt: new Date().toISOString(),
  };
  state.sessions.push(s);
  // 刻意练习：加练和打卡一样，写下的内容立刻过一遍本地点评（AI 深度点评在完成页）
  if (countWords(s.draft) >= 5) s.feedback = analyzeWriting(s.draft, state.level);
  save();
  extraDone = s; extraPick = null; render();
}

/* ---- 自主加练 ---- */
function extraTaskFor(skill, idx) {
  const list = TASKS[state.level].filter(t => t.t === skill);
  return list[((idx % list.length) + list.length) % list.length];
}
/* 抽卡去重：同一技能下，一轮内不重复；一轮练完自动开新一轮。
   今天打卡那张卡也不会出现在加练里。 */
function extraPickIdx(skill) {
  state.extraSeen = state.extraSeen || {};
  const key = state.level + ":" + skill;
  const list = TASKS[state.level].filter(t => t.t === skill);
  const seen = new Set(state.extraSeen[key] || []);
  const dt = taskFor(state.level, todayKey(), (getDay(todayKey()) || { swap: 0 }).swap || 0);
  const dailyIdx = list.indexOf(dt);
  let avail = list.map((_, i) => i).filter(i => !seen.has(i) && i !== dailyIdx);
  if (!avail.length) {
    state.extraSeen[key] = []; // 开启新一轮
    avail = list.map((_, i) => i).filter(i => i !== dailyIdx);
    if (!avail.length) avail = list.map((_, i) => i);
  }
  const idx = avail[Math.floor(Math.random() * avail.length)];
  state.extraSeen[key] = (state.extraSeen[key] || []).concat(idx);
  return idx;
}
function extraSwapIdx(pick) {
  state.extraSeen = state.extraSeen || {};
  const key = state.level + ":" + pick.skill;
  const list = TASKS[state.level].filter(t => t.t === pick.skill);
  if (list.length < 2) return pick.idx; // 只有一张卡，换不了
  const seen = new Set((state.extraSeen[key] || []).filter(i => i !== pick.idx));
  let avail = list.map((_, i) => i).filter(i => !seen.has(i) && i !== pick.idx);
  if (!avail.length) {
    state.extraSeen[key] = [pick.idx]; // 新一轮，只记住当前这张
    avail = list.map((_, i) => i).filter(i => i !== pick.idx);
  }
  const idx = avail[Math.floor(Math.random() * avail.length)];
  state.extraSeen[key] = (state.extraSeen[key] || []).concat(idx);
  return idx;
}
function renderExtra(main) {
  if (extraDone) { renderExtraDone(main); return; }
  if (!extraPick) { renderExtraPick(main); return; }
  renderExtraTask(main);
}
function renderExtraPick(main) {
  const t = dayStats(todayKey());
  main.innerHTML = `
    <div class="card">
      <div class="section-title">自主加练</div>
      <p class="hint">每日打卡照旧；想多练的时候来这儿，听说读写任选一项。加练不限次数，时长和新学内容都会计入「统计」。</p>
      <div class="skill-grid">
        <button class="skill-opt" data-skill="听"><b>🎧 听</b><span>盲听短文</span></button>
        <button class="skill-opt" data-skill="说"><b>🎙 说</b><span>开口 + 计时</span></button>
        <button class="skill-opt" data-skill="读"><b>📖 读</b><span>短文 + 回应</span></button>
        <button class="skill-opt" data-skill="写"><b>✍️ 写</b><span>场景写作</span></button>
      </div>
      ${t.sessions || t.secs ? `<p class="hint" style="margin-top:14px">今天已加练 <b>${t.sessions}</b> 次 · 今日累计学习 ${fmtMins(t.secs)}。再来一项？</p>` : ""}
    </div>`;
  main.querySelectorAll(".skill-opt").forEach(b =>
    b.addEventListener("click", () => {
      extraPick = { skill: b.dataset.skill, idx: extraPickIdx(b.dataset.skill), startedAt: Date.now(), draft: "" };
      render();
    }));
}
function renderExtraTask(main) {
  const task = extraTaskFor(extraPick.skill, extraPick.idx);
  const lv = LEVELS[state.level];
  extraPick.startedAt = Date.now(); // 切走再切回来不计空白时间
  const metaText =
    task.t === "说" ? `建议时长 ≥ ${lv.secs} 秒 · 说完结束` :
    task.t === "写" ? `目标 ≥ ${lv.words} 个词 · 自动计时` :
    task.t === "听" ? "先别看原文，盲听 2-3 遍，再完成检验" :
    "读完后用英语回应（写或说都算）";
  main.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <span class="task-type">${SKILL_BADGE[task.t] || task.t} · 加练</span>
        <div class="row">

/* ---- 统计 ---- */
function fmtMins(secs) {
  const m = Math.round((secs || 0) / 60);
  if (m < 60) return m + " 分钟";
  return Math.floor(m / 60) + " 小时 " + (m % 60) + " 分";
}
function dayStats(key) {
  let secs = 0, nw = 0, np = 0, ns = 0, sessions = 0, autoW = 0, autoP = 0;
  const d = state.days[key];
  if (d && d.done) { secs += d.secs || 0; nw += d.nw || 0; np += d.np || 0; ns += d.ns || 0; }
  (state.sessions || []).forEach(s => {
    if (s.date === key) { secs += s.secs || 0; nw += s.nw || 0; np += s.np || 0; ns += s.ns || 0; sessions++; }
  });
  // 生词库自动计入：当天划词收进来的，单词算 nw、短语算 np
  (state.vocab || []).forEach(v => {
    if (v.added === key) {
      if (/\s/.test(v.display.trim())) { np++; autoP++; } else { nw++; autoW++; }
    }
  });
  return { secs, nw, np, ns, sessions, autoW, autoP };
}
function allTotals() {
  let secs = 0, nw = 0, np = 0, ns = 0, done = 0, sessions = 0;
  Object.values(state.days).forEach(d => {
    if (d && d.done) { done++; secs += d.secs || 0; nw += d.nw || 0; np += d.np || 0; ns += d.ns || 0; }
  });
  (state.sessions || []).forEach(s => { sessions++; secs += s.secs || 0; nw += s.nw || 0; np += s.np || 0; ns += s.ns || 0; });
  (state.vocab || []).forEach(v => {
    if (/\s/.test(v.display.trim())) np++; else nw++;
  });
  return { secs, nw, np, ns, done, sessions };
}
function svgBarChart(rows, series, opts = {}) {
  const W = 620, H = 240, padL = 40, padR = 8, padT = 20, padB = 30;
  const n = rows.length, bw = (W - padL - padR) / n;
  const totals = rows.map(r => series.reduce((a, s) => a + (r[s.key] || 0), 0));
  const rawMax = Math.max(opts.min || 1, ...totals);
  const step = Math.max(1, Math.ceil(rawMax / 4));
  const top = Math.ceil(rawMax / step) * step;
  const yv = v => padT + (H - padT - padB) * (1 - v / top);
  let svg = "";
  for (let v = step; v <= top; v += step) {
    svg += `<line x1="${padL}" y1="${yv(v).toFixed(1)}" x2="${W - padR}" y2="${yv(v).toFixed(1)}" stroke="#e3e7e4"/>` +
      `<text x="${padL - 6}" y="${(yv(v) + 3).toFixed(1)}" text-anchor="end" font-size="10" fill="#8a938e">${v}</text>`;
  }
  svg += `<line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#c8cfcb"/>`;
  rows.forEach((r, i) => {
    const x = padL + i * bw + 2, w = bw - 4;
    let acc = 0;
    series.forEach(s => {
      const v = r[s.key] || 0;
      if (v > 0) {
        const y1 = yv(acc + v), y2 = yv(acc);
        svg += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(2, y2 - y1).toFixed(1)}" rx="2" fill="${s.color}"/>`;
      }
      acc += v;
    });
    if (totals[i] > 0) svg += `<text x="${(x + w / 2).toFixed(1)}" y="${(yv(totals[i]) - 5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="600" fill="#5c6660">${totals[i]}${opts.unit || ""}</text>`;
    svg += `<text x="${(x + w / 2).toFixed(1)}" y="${H - padB + 14}" text-anchor="middle" font-size="9.5" fill="#8a938e">${r.k.slice(5).replace("-", "/")}</text>`;
  });
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`;
}
function renderStats(main) {
  const tot = allTotals();

  const keys = []; for (let i = 13; i >= 0; i--) keys.push(todayKey(-i));

/* ---- 生词库：阅读划词入库 → 独立页精加工（解释→造句→点评→逐条存学习库） ---- */
let selPopupEl = null;
function hideSelPopup() {
  if (selPopupEl) { selPopupEl.remove(); selPopupEl = null; }
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add("show"), 10);
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 1600);
}
async function aiExplainFetch(word, sentence) {
  const ai = state.ai || {};
  const headers = { "Content-Type": "application/json" };
  if (ai.key) headers["Authorization"] = "Bearer " + ai.key;
  const resp = await fetch(ai.base.replace(/\/+$/, "") + "/chat/completions", {
    method: "POST",
    headers,
    body: JSON.stringify({
      model: ai.model,
      messages: [
        { role: "system", content: "你是英语词汇老师。用户给你一个英文单词或短语和它的出处句子。严格输出两行：第一行：词性 + 结合句中语境的中文释义；第二行：一个用它的新例句（难度与用户水平 " + state.level + " 相当）。不要输出任何其他内容。" },
        { role: "user", content: "单词/短语：" + word + "\n出处句子：" + sentence },
      ],
    }),
  });
  if (!resp.ok) throw new Error("HTTP " + resp.status + " " + (await resp.text()).slice(0, 120));
  const data = await resp.json();
  const text = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
  if (!text.trim()) throw new Error("AI 返回了空内容");
  return text.trim();
}
function bindPassageSelect(box, passage) {
  if (!box) return;
  box.addEventListener("mouseup", () => {
    setTimeout(() => {
      const sel = window.getSelection && window.getSelection();
      if (!sel || sel.isCollapsed) return;
      const text = sel.toString().replace(/\s+/g, " ").trim();
      if (!text || text.length > 80) return;
      if (!box.contains(sel.anchorNode)) return;
      let rect;
      try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch (e) { return; }
      showSelPopup(text, sentenceOf(passage, text), rect);
    }, 10);
  });
  // 点页面其他地方时收起弹窗（document 级监听只绑一次）
  if (!bindPassageSelect._docBound) {
    bindPassageSelect._docBound = true;
    document.addEventListener("mousedown", e => {
      if (selPopupEl && !selPopupEl.contains(e.target) && !(e.target && e.target.closest && e.target.closest("#passageBox"))) hideSelPopup();
    });
  }
}
function showSelPopup(text, sentence, rect) {
  hideSelPopup();
  const el = document.createElement("div");
  el.className = "sel-popup";
  el.innerHTML = `
    <div class="sel-word">${esc(text)}</div>
    <div class="sel-explain" id="selExplain">…</div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn primary" id="selAdd">＋ 添加到生词库</button>
    </div>`;
  document.body.appendChild(el);
  el.style.top = (rect.bottom + window.scrollY + 6) + "px";
  el.style.left = Math.max(8, Math.min(rect.left + window.scrollX, window.innerWidth - 280)) + "px";
  selPopupEl = el;
  const exEl = el.querySelector("#selExplain");
  const ai = state.ai || {};
  if (ai.base && ai.model) {
    exEl.textContent = "AI 解释加载中…";
    aiExplainFetch(text, sentence)
      .then(t => { if (selPopupEl === el) { exEl.textContent = t; exEl.dataset.done = "1"; } })
      .catch(() => { if (selPopupEl === el) exEl.textContent = "（解释加载失败，可在「生词库」页重试）"; });
  } else {
    exEl.textContent = "加入后可在「生词库」页点 AI 解释（先在「记录」页配置接口）";
  }
  el.querySelector("#selAdd").addEventListener("click", () => {
    const entry = addVocab(text, sentence);
    if (exEl.dataset.done === "1" && exEl.textContent.trim()) entry.explain = exEl.textContent.trim();
    save();
    hideSelPopup();
    if (window.getSelection) window.getSelection().removeAllRanges();
    toast("已加入生词库 ✓");
  });
}
function sentenceOf(passage, word) {
  const norm = s => s.toLowerCase().replace(/[^a-z]/g, "");
  const parts = passage.match(/[^.!?]+[.!?]+(?:\s+|$)/g) || [passage];
  const hit = parts.find(s => norm(s).includes(norm(word)));
  return (hit || passage).trim();
}
function addVocab(word, sentence) {
  const w = word.toLowerCase();
  let entry = (state.vocab || []).find(v => v.word === w);
  if (!entry) {
    state.nextVocabId = state.nextVocabId || (state.vocab.length + 1);
    entry = { id: state.nextVocabId++, word: w, display: word, sentence, explain: "", example: "", fb: [], saved: false, added: todayKey() };
    state.vocab.push(entry);
  } else {
    entry.sentence = sentence; // 用最新的出处句子
  }
  return entry;
}
async function aiReviewVocab(entry, btn) {
  // runAiReview 内部对 day.feedback 重新赋值，用代理对象接住再回写
  const proxy = { draft: entry.example, feedback: entry.fb || [] };
  await runAiReview(proxy, btn);
  if (proxy.feedback !== (entry.fb || [])) entry.fb = proxy.feedback;
}
async function runAiVocabExplain(entry, btn) {
  const ai = state.ai || {};
  if (!ai.base || !ai.model || (!ai.key && !/^(\/|https?:\/\/(127\.0\.0\.1|localhost))/i.test(ai.base))) {
    alert("先在「记录」页配置 AI 接口：地址和模型必填，本机地址可不填 Key");
    return;
  }
  const localBase = /^(\/|https?:\/\/(127\.0\.0\.1|localhost))/i.test(ai.base);
  if (location.protocol === "file:" && localBase) {
    alert("AI 功能需要在本机中转地址下使用：请打开 http://127.0.0.1:8787/ （开机自启的入口就是它）");
    return;
  }
  btn.disabled = true; btn.textContent = "解释中…";
  try {
    entry.explain = await aiExplainFetch(entry.display, entry.sentence);
    save(); render();
  } catch (e) {
    const isHttpError = /^HTTP \d/.test(e.message);
    const hint = isHttpError
      ? "接口已连通，以上是模型返回的错误，按其提示调整配置即可。"
      : localBase
      ? "本机中转（127.0.0.1:8787）没响应，可到项目目录运行 python proxy.py 手动拉起。"
      : "网络不通、地址写错或跨域被拦截。";
    alert("AI 解释失败：" + e.message + "\n\n" + hint);
    btn.disabled = false; btn.textContent = "AI 解释（结合原句）";
  }
}
function vocabToCard(entry) {

  return `
    <div class="grid2" style="margin-top:10px">
      <input type="text" id="qaEn" placeholder="英文表达，如：cut to the chase">
      <input type="text" id="qaZh" placeholder="意思/用法，如：开门见山，别绕弯子">
    </div>
    <input type="text" id="qaCtx" style="margin-top:10px" placeholder="语境（可选）：你今天想用它说的那句话">
    <div class="btn-row">
      <button class="btn primary" id="qaAdd">存进表达库</button>
    </div>`;
}
function bindQuickAdd(root) {
  const btn = $("#qaAdd", root);
  if (!btn) return;
  btn.addEventListener("click", () => {
    const en = $("#qaEn", root).value.trim();
    const zh = $("#qaZh", root).value.trim();
    const ctx = $("#qaCtx", root).value.trim();
    if (!en || !zh) { alert("英文和意思都要填"); return; }
    addCard(en, zh, ctx, "expr");
    save(); render();
  });
}

/* ---- 复习 ---- */
function startReview() {
  const queue = dueCards();
  review = { queue, idx: 0, showA: false };
}
function gradeCard(card, grade) {
  // grade: 0 忘了 / 1 模糊 / 2 记得
  if (grade === 0) { card.step = 1; card.due = todayKey(1); }
  else if (grade === 1) {
    const gap = Math.max(1, Math.floor(REVIEW_STEPS[Math.min(card.step, REVIEW_STEPS.length - 1)] / 2));
    card.due = todayKey(gap);
  } else {
    card.step = Math.min(card.step + 1, REVIEW_STEPS.length - 1);
    card.due = todayKey(REVIEW_STEPS[card.step]);
  }
  save();
}
function renderReview(main) {
  const due = dueCards();
  if (!review) {
    main.innerHTML = `
      <div class="card" style="text-align:center;padding:34px 20px">
        <h2 style="font-size:18px">${due.length ? `有 ${due.length} 条表达等你回忆` : "今天没有到期的表达"}</h2>
        <p class="hint" style="margin-top:6px">规则：看中文 → 开口说出英文 → 再对答案。<b>说出口</b>才算数。</p>
        ${due.length ? `<div class="btn-row" style="justify-content:center"><button class="btn primary" id="startRv">开始复习（约 ${Math.max(1, Math.round(due.length * 0.4))} 分钟）</button></div>` : ""}
        <div class="btn-row" style="justify-content:center">
          <button class="btn ghost" id="exportSm">导出 SuperMemo 文件</button>
        </div>
      </div>`;
    const st = $("#startRv"); if (st) st.addEventListener("click", () => { startReview(); render(); });
    $("#exportSm").addEventListener("click", exportSuperMemo);
    return;
  }
  if (review.idx >= review.queue.length) {
    const n = review.queue.length;
    review = null;
    main.innerHTML = `
      <div class="card done-hero">
        <div class="big">🎉</div>
        <h2>${n} 条全部过完</h2>
        <p>内置复习是轻量的。想上强度，随时把表达库导给 SuperMemo。</p>
      </div>`;
    return;
  }
  const card = review.queue[review.idx];
  main.innerHTML = `
    <div class="card">
      <div class="hint" style="text-align:center">${review.idx + 1} / ${review.queue.length}</div>
      <div class="review-q">${esc(card.zh)}</div>
      ${card.ctx ? `<div class="review-ctx">语境：${esc(card.ctx)}</div>` : ""}
      ${review.showA
        ? `<div class="review-a">${esc(card.en)}</div>
           <div class="grade-row btn-row">
             <button class="btn danger" data-grade="0">忘了</button>
             <button class="btn" data-grade="1">模糊</button>
             <button class="btn primary" data-grade="2">记得</button>
           </div>`
        : `<div class="btn-row" style="justify-content:center"><button class="btn primary" id="showA">说出英文后，点我看答案</button></div>`}
    </div>`;
  const sa = $("#showA");
  if (sa) sa.addEventListener("click", () => { review.showA = true; render(); });
  main.querySelectorAll("[data-grade]").forEach(b =>
    b.addEventListener("click", () => {
      gradeCard(card, Number(b.dataset.grade));
      review.idx++; review.showA = false; render();
    }));
}

/* ---- 表达库 ---- */
function renderCards(main) {
  const t = todayKey();
  const sorted = [...state.cards].sort((a, b) => a.due < b.due ? -1 : 1);
  main.innerHTML = `
    <div class="card">
      <div class="section-title">存一条新表达</div>
      ${quickAddForm()}
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <div class="section-title" style="margin:0">全部表达（${state.cards.length}）</div>
        <div class="row">
          <button class="btn ghost" id="exportSm">导出 SuperMemo</button>
        </div>
      </div>
      ${sorted.length ? `<ul class="list">
        ${sorted.map(c => `
          <li>
            ${c.type === "fb" ? `<span class="tag-fb">反馈</span>` : c.type === "vocab" ? `<span class="tag-fb" style="background:#e8f0fb;color:#4a7fa5">生词</span>` : ""}
            <span class="en">${esc(c.en)}</span>
            <span class="zh">${esc(c.zh)}</span>
            <span class="due ${c.due <= t ? "today" : ""}">${c.due <= t ? "待复习" : c.due + " 见"}</span>
            <button class="btn ghost danger" data-del="${c.id}" title="删除">×</button>
          </li>`).join("")}
      </ul>` : `<div class="empty">还什么都没有。每天打卡后顺手留一条，慢慢就攒起来了。</div>`}
    </div>`;
  bindQuickAdd(main);
  $("#exportSm").addEventListener("click", exportSuperMemo);
  main.querySelectorAll("[data-del]").forEach(b =>
    b.addEventListener("click", () => {
      if (!confirm("删掉这条表达？")) return;
      state.cards = state.cards.filter(c => c.id !== Number(b.dataset.del));
      save(); render();
    }));
}

function exportSuperMemo() {
  if (!state.cards.length) { alert("表达库是空的，先存几条。"); return; }
  // SuperMemo 经典 Q&A 文本格式：File > Import > Q&A text 直接导入
  const lines = state.cards.map(c => {
    const a = c.ctx ? `${c.en}\n${c.ctx}` : c.en;
    return `Q: ${c.zh}\nA: ${a}`;
  }).join("\n\n");
  download(lines + "\n", `supermemo-english-${todayKey()}.txt`, "text/plain;charset=utf-8");
}

/* ---- 记录 ---- */
function renderMe(main) {
  const days = Object.entries(state.days)
    .filter(([, d]) => d.done)
    .sort((a, b) => (a[0] < b[0] ? 1 : -1));
  const skills = { "听": 0, "说": 0, "读": 0, "写": 0 };
  days.forEach(([, d]) => { if (d.skill) skills[d.skill] = (skills[d.skill] || 0) + 1; });
  (state.sessions || []).forEach(s => { if (s.skill) skills[s.skill] = (skills[s.skill] || 0) + 1; });
  const tot = allTotals();
  const hist = [
    ...days.map(([k, d]) => ({ k, level: d.level, skill: d.skill, draft: d.draft, secs: d.secs, extra: false })),
    ...(state.sessions || []).map(s => ({ k: s.date, level: "", skill: s.skill, draft: s.draft, secs: s.secs, extra: true })),
  ].sort((a, b) => (a.k < b.k ? 1 : -1));
  main.innerHTML = `
    <div class="stat-row">
      <div class="stat amber"><b>${streak()}</b><span>连续天数</span></div>
      <div class="stat"><b>${totalDone()}</b><span>总打卡</span></div>
      <div class="stat"><b>${tot.sessions}</b><span>总加练</span></div>
      <div class="stat"><b>${state.cards.length}</b><span>表达库存</span></div>
    </div>
    <div class="stat-row">
      <div class="stat"><b>${skills["听"]}</b><span>🎧 听</span></div>
      <div class="stat"><b>${skills["说"]}</b><span>🎙 说</span></div>
      <div class="stat"><b>${skills["读"]}</b><span>📖 读</span></div>
      <div class="stat"><b>${skills["写"]}</b><span>✍️ 写</span></div>
    </div>
    <p class="hint" style="margin-top:-8px">四科分布含每日打卡与自主加练。</p>
    <div class="card">
      <div class="section-title">AI 深度点评（可选）</div>
      ${location.protocol === "file:" ? `
      <div class="banner" style="margin-bottom:10px">
        <span>AI 点评在本机中转地址下才能用（从文件直接打开的页面会被浏览器拦截请求）。</span>
        <a class="btn primary" href="http://127.0.0.1:8787/">切换到 http://127.0.0.1:8787/</a>
      </div>` : ""}
      <div class="grid2">
        <input type="text" id="aiBase" placeholder="接口地址，如 https://api.openai.com/v1" value="${esc(state.ai.base)}">
        <input type="text" id="aiModel" placeholder="模型，如 gpt-4o-mini / deepseek-chat" value="${esc(state.ai.model)}">
      </div>
      <input type="text" id="aiKey" style="margin-top:10px" placeholder="API Key（只保存在本机浏览器里）" value="${esc(state.ai.key)}">
      <div class="btn-row" style="margin-top:10px">
        <button class="btn" id="aiFillKimi">一键填 Kimi 会员</button>
        <button class="btn" id="aiSave">保存配置</button>
        <button class="btn" id="aiTest">测试连接</button>
      </div>
      <div class="ai-status" id="aiTestResult"></div>
      <p class="hint">任何兼容 OpenAI 格式的接口都行。Kimi 会员 → http://127.0.0.1:8787/v1（走本机中转，模型按档位填 kimi-for-coding 或 k3-256k）· Moonshot 开放平台 → https://api.moonshot.cn/v1 · DeepSeek → https://api.deepseek.com/v1 · OpenRouter → https://openrouter.ai/api/v1。地址只填到 /v1。不配也不影响本地点评，本地点评永远离线可用。</p>
    </div>
    <div class="card">
      <div class="section-title">数据备份</div>
      <div class="btn-row" style="margin-top:4px">
        <button class="btn" id="backupBtn">导出备份（JSON）</button>
        <button class="btn" id="restoreBtn">导入备份</button>
        <input type="file" id="restoreFile" accept=".json" style="display:none">
      </div>
      <p class="hint">数据存在这台电脑的浏览器里。换浏览器/重装前记得导出备份。</p>
    </div>
    <div class="card">
      <div class="section-title">历史记录</div>
      ${hist.length ? hist.map(h => `
        <div class="hist-item">
          <div class="hist-head"><b>${h.k}</b><span>${h.extra ? `<span class="tag-fb" style="background:var(--accent-soft);color:var(--accent)">加练</span> ` : ""}${esc(h.level || "")}${h.skill ? " · " + esc(SKILL_BADGE[h.skill] || h.skill) : ""}${h.secs ? " · " + fmtMins(h.secs) : ""}</span></div>
          ${h.draft ? `<div class="hist-text">${esc(h.draft)}</div>` : ""}
        </div>`).join("") : `<div class="empty">还没有记录，今天就是第一天。</div>`}
    </div>`;
  $("#backupBtn").addEventListener("click", () =>
    download(JSON.stringify(state, null, 2), `daily-english-backup-${todayKey()}.json`, "application/json"));
  $("#aiSave").addEventListener("click", () => {
    state.ai = { base: $("#aiBase").value.trim(), model: $("#aiModel").value.trim(), key: $("#aiKey").value.trim() };
    save(); alert("已保存");
  });
  $("#aiFillKimi").addEventListener("click", () => {
    $("#aiBase").value = "http://127.0.0.1:8787/v1";
    $("#aiModel").value = "k3-256k";
    $("#aiTestResult").textContent = "已填好 Kimi 会员地址和模型，只需粘贴 Key，然后点「测试连接」";
    $("#aiTestResult").style.color = "var(--accent)";
  });
  $("#aiTest").addEventListener("click", async () => {
    const base = $("#aiBase").value.trim(), model = $("#aiModel").value.trim(), key = $("#aiKey").value.trim();
    const out = $("#aiTestResult");
    const show = (msg, ok) => { out.textContent = msg; out.style.color = ok ? "var(--accent)" : "var(--red)"; };
    const isLocal = /^(\/|https?:\/\/(127\.0\.0\.1|localhost))/i.test(base);
    if (!base || !model || (!key && !isLocal)) { show("⚠ 接口地址和模型必填；本机地址（127.0.0.1）可不填 Key，其他服务必须填", false); return; }
    if (/\/chat\/completions\/?$/i.test(base)) { show("⚠ 地址填到 /v1 为止，不要带 /chat/completions（工具会自动拼）", false); return; }
    if (location.protocol === "file:" && isLocal) {
      show("⚠ 当前是从文件直接打开的页面，浏览器会拦截本机请求。请点上方链接切换到 http://127.0.0.1:8787/ 再测", false); return;
    }
    show("测试中…", true);
    const t0 = Date.now();
    try {
      const headers = { "Content-Type": "application/json" };
      if (key) headers["Authorization"] = "Bearer " + key;
      const resp = await fetch(base.replace(/\/+$/, "") + "/chat/completions", {
        method: "POST",
        headers,
        body: JSON.stringify({ model, max_tokens: 50, messages: [{ role: "user", content: "Reply with exactly: ok" }] }),
      });
      const ms = Date.now() - t0;
      if (!resp.ok) {
        const txt = (await resp.text()).slice(0, 150);
        show(`✗ 连接失败：HTTP ${resp.status} — ${txt}`, false);
        return;
      }
      const data = await resp.json();
      const msg0 = (((data.choices || [])[0] || {}).message) || {};
      const reply = msg0.content || msg0.reasoning_content || "";
      show(`✓ 连接成功（${ms}ms），模型回复：${String(reply).trim().slice(0, 40) || "(空回复)"}`, true);
    } catch (e) {
      show(`✗ 请求失败：${e.message}（网络不通、地址写错或跨域被拦截）`, false);
    }
  });
  $("#restoreBtn").addEventListener("click", () => $("#restoreFile").click());
  $("#restoreFile").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || typeof data !== "object" || !data.days) throw new Error("bad");
        state = Object.assign(blankState(), data);
        save(); alert("恢复成功"); render();
      } catch { alert("文件格式不对"); }
    };
    r.readAsText(f);
  });
}

function download(content, filename, mime) {
  const blob = new Blob(["\ufeff" + content], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---- 调整级别 ---- */
function changeLevel() {
  const cur = state.level;
  const pick = prompt(
    "当前级别：" + LEVELS[cur].label + "\n\n输入新级别（A1 / A2 / B1 / B2 / C1 / C2）：\n" +
    LEVEL_ORDER.map(k => `${k}：${LEVELS[k].desc}`).join("\n"), cur);
  if (!pick) return;
  const v = pick.trim().toUpperCase();
  if (!LEVELS[v]) { alert("级别无效"); return; }
  state.level = v; save(); render();
}

render();
syncPull();
</script>
